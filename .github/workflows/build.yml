name: R4 HNAT wired firmware
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-hnat-build-20261027
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Runner disk
        run: bash scripts/runner-space.sh setup
      - name: Host packages
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl subversion libelf-dev device-tree-compiler zstd
          sudo apt-get clean
          bash scripts/runner-space.sh snapshot prerequisites
      - name: Pin sources and defconfig
        timeout-minutes: 40
        run: |
          python3 scripts/prepare.py --workdir "$WORK"
          rm -rf -- "$WORK/sources"
          bash scripts/runner-space.sh snapshot prepared
      - name: Download
        timeout-minutes: 40
        run: |
          python3 scripts/bounded-log.py --workdir "$WORK" --stage download -- make -C "$WORK/openwrt" download -j4 V=s
          bash scripts/runner-space.sh snapshot downloaded
      - name: Tools and toolchain
        timeout-minutes: 180
        run: |
          python3 scripts/bounded-log.py --workdir "$WORK" --stage tools -- make -C "$WORK/openwrt" tools/install -j2 V=s
          python3 scripts/bounded-log.py --workdir "$WORK" --stage toolchain -- make -C "$WORK/openwrt" toolchain/install -j2 V=s
          bash scripts/runner-space.sh snapshot toolchain
      - name: Packages and images
        timeout-minutes: 70
        run: |
          python3 scripts/bounded-log.py --workdir "$WORK" --stage build -- make -C "$WORK/openwrt" -j2 V=s
          bash scripts/runner-space.sh snapshot built
      - name: Collect firmware names and hashes
        if: always()
        run: python3 scripts/collect.py --workdir "$WORK"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-hnat-${{ github.run_id }}
          path: ${{ env.WORK }}/delivery
          if-no-files-found: warn
          retention-days: 1
